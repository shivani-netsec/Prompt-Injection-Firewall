<!DOCTYPE html>
<html>
<head>
    <title>Prompt Injection Firewall Dashboard</title>

    <style>

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            margin:30px;
        }

        h1{
            text-align:center;
        }

        .cards{
            display:flex;
            gap:20px;
            justify-content:center;
            margin-top:30px;
        }

        .card{
            width:220px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
            text-align:center;
        }

        .card h2{
            margin:0;
            color:#555;
        }

        .number{
            font-size:40px;
            margin-top:15px;
            font-weight:bold;
        }

        table{
            width:100%;
            margin-top:40px;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#333;
            color:white;
        }

    </style>

</head>

<body>

<h1>Prompt Injection Firewall Dashboard</h1>

<div class="cards">

    <div class="card">
        <h2>Total Requests</h2>
        <div class="number">{{ stats.total }}</div>
    </div>

    <div class="card">
        <h2>Allowed</h2>
        <div class="number">{{ stats.allowed }}</div>
    </div>

    <div class="card">
        <h2>Sanitized</h2>
        <div class="number">{{ stats.sanitized }}</div>
    </div>

    <div class="card">
        <h2>Blocked</h2>
        <div class="number">{{ stats.blocked }}</div>
    </div>

</div>

<table>

<tr>
    <th>Event ID</th>
    <th>Severity</th>
    <th>Decision</th>
    <th>Processing Time</th>
</tr>

<tr>
    <td colspan="4">No incidents yet</td>
</tr>

</table>

</body>
</html>
